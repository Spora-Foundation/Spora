name: Spora Devnet Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/spora-devnet-acceptance.yml"
      - ".gitmodules"
      - "Cargo.lock"
      - "Cargo.toml"
      - "cellscript/**"
      - "components/**"
      - "consensus/**"
      - "docs/SPORA_CELLSCRIPT_DEVNET_ACCEPTANCE_PLAN.md"
      - "exec/**"
      - "indexes/**"
      - "mining/**"
      - "notify/**"
      - "protocol/**"
      - "rpc/**"
      - "scripts/devnet_acceptance.sh"
      - "simpa/**"
      - "sporad/**"
      - "state/**"
      - "testing/integration/**"
      - "treasure_boy/**"
      - "wallet/**"
  push:
    branches:
      - main
      - master
      - spora
    paths:
      - ".github/workflows/spora-devnet-acceptance.yml"
      - ".gitmodules"
      - "Cargo.lock"
      - "Cargo.toml"
      - "cellscript/**"
      - "components/**"
      - "consensus/**"
      - "docs/SPORA_CELLSCRIPT_DEVNET_ACCEPTANCE_PLAN.md"
      - "exec/**"
      - "indexes/**"
      - "mining/**"
      - "notify/**"
      - "protocol/**"
      - "rpc/**"
      - "scripts/devnet_acceptance.sh"
      - "simpa/**"
      - "sporad/**"
      - "state/**"
      - "testing/integration/**"
      - "treasure_boy/**"
      - "wallet/**"
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Acceptance profile to run"
        required: true
        default: "full"
        type: choice
        options:
          - smoke
          - external-boot
          - propagation
          - cellscript
          - full

concurrency:
  group: spora-devnet-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Devnet Smoke
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/spora-devnet-smoke-target
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          rustup default 1.82.0
          rustc --version
          cargo --version

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev llvm-dev pkg-config protobuf-compiler
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-devnet-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-devnet-smoke-
            ${{ runner.os }}-cargo-

      - name: Run devnet smoke acceptance
        run: ./scripts/devnet_acceptance.sh --profile smoke

  full:
    name: Devnet Full
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/spora-devnet-full-target
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          rustup default 1.82.0
          rustc --version
          cargo --version

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev llvm-dev pkg-config protobuf-compiler
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-devnet-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-devnet-full-
            ${{ runner.os }}-cargo-

      - name: Run full devnet acceptance
        run: ./scripts/devnet_acceptance.sh --profile full --keep-artifacts

  focused:
    name: Devnet Focused
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["external-boot","propagation","cellscript"]'), inputs.profile)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/spora-devnet-focused-target
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          rustup default 1.82.0
          rustc --version
          cargo --version

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev llvm-dev pkg-config protobuf-compiler
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-devnet-focused-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-devnet-focused-
            ${{ runner.os }}-cargo-

      - name: Run focused devnet acceptance
        run: ./scripts/devnet_acceptance.sh --profile "${{ inputs.profile }}" --keep-artifacts
