name: CellScript CKB Gate

on:
  pull_request:
    paths:
      - ".github/workflows/cellscript-ckb-gate.yml"
      - ".gitmodules"
      - "cellscript"
      - "cellscript/**"
  push:
    branches:
      - main
      - master
      - spora
    paths:
      - ".github/workflows/cellscript-ckb-gate.yml"
      - ".gitmodules"
      - "cellscript"
      - "cellscript/**"
  workflow_dispatch:

concurrency:
  group: cellscript-ckb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ckb-release-gate:
    name: CKB Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/cellscript-ckb-release-gate-target
      CELLSCRIPT_BACKEND_SHAPE_REPORT: ${{ github.workspace }}/cellscript/target/cellscript-backend-shape/backend-shape-report-v1.json
      CELLSCRIPT_MOLECULE_SCHEMA_MANIFEST_REPORT: ${{ github.workspace }}/cellscript/target/cellscript-schema-manifest/schema-manifest-report-v1.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev llvm-dev pkg-config protobuf-compiler ripgrep
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run CellScript CKB release gate
        run: ./cellscript/scripts/cellscript_ckb_release_gate.sh quick

      - name: Upload CellScript release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellscript-ckb-reports
          if-no-files-found: warn
          path: |
            cellscript/target/cellscript-backend-shape/
            cellscript/target/cellscript-schema-manifest/
            cellscript/target/ckb-cellscript-acceptance/
