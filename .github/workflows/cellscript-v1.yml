name: CellScript V1 Gate

on:
  pull_request:
    paths:
      - ".github/workflows/cellscript-v1.yml"
      - ".gitmodules"
      - "Cargo.lock"
      - "Cargo.toml"
      - "README.md"
      - "cellscript"
      - "cellscript/**"
      - "consensus/**"
      - "docs/CELLSCRIPT_*.md"
      - "docs/SERIALIZATION_LAYER_GOVERNANCE_MIGRATION_PLAN.md"
      - "docs/SPORA_CELLSCRIPT_DEVNET_ACCEPTANCE_PLAN.md"
      - "docs/SPORA_DSL_DESIGN_PROPOSAL*.md"
      - "exec/**"
      - "mining/**"
      - "scripts/cellscript_phase4_release_gate.sh"
      - "scripts/ckb_cellscript_acceptance.sh"
      - "sdk/adaptor/**"
      - "wallet/**"
  push:
    branches:
      - main
      - master
      - spora
    paths:
      - ".github/workflows/cellscript-v1.yml"
      - ".gitmodules"
      - "Cargo.lock"
      - "Cargo.toml"
      - "README.md"
      - "cellscript"
      - "cellscript/**"
      - "consensus/**"
      - "docs/CELLSCRIPT_*.md"
      - "docs/SERIALIZATION_LAYER_GOVERNANCE_MIGRATION_PLAN.md"
      - "docs/SPORA_CELLSCRIPT_DEVNET_ACCEPTANCE_PLAN.md"
      - "docs/SPORA_DSL_DESIGN_PROPOSAL*.md"
      - "exec/**"
      - "mining/**"
      - "scripts/cellscript_phase4_release_gate.sh"
      - "scripts/ckb_cellscript_acceptance.sh"
      - "sdk/adaptor/**"
      - "wallet/**"
  workflow_dispatch:

concurrency:
  group: cellscript-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v1-release-gate:
    name: V1 Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /tmp/spora-v1-release-gate-target
      CELLSCRIPT_BACKEND_SHAPE_REPORT: ${{ github.workspace }}/target/cellscript-backend-shape/backend-shape-report-v1.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev llvm-dev pkg-config protobuf-compiler
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Locked dependency preflight
        run: |
          cargo check --locked --workspace --all-targets
          cargo test --locked -p cellscript -- --test-threads=1

      - name: Run CellScript v1 release gate
        run: ./scripts/cellscript_phase4_release_gate.sh v1

      - name: Upload CellScript release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellscript-v1-reports
          if-no-files-found: warn
          path: |
            target/cellscript-backend-shape/
            target/ckb-cellscript-acceptance/
