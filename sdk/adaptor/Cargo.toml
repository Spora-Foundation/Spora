[package]
name = "spora-adaptor"
version = "1.0.2"
edition = "2021"
publish = false
authors = ["Spora developers"]
license = "ISC"
repository = "https://github.com/AvatoLabs/Spora"

[dependencies]
k256 = { version = "0.13", features = ["arithmetic", "ecdsa"] }
secp256k1 = { workspace = true }
serde = { version = "1.0", features=["derive"] }
thiserror = "1.0"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6.4"
generic-array = "0.14.7"

[dev-dependencies]
rand = "0.8"
k256 = { version = "0.13", features = ["arithmetic", "ecdsa"] }
