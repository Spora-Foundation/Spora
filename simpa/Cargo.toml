[package]
name = "simpa"
description = "Spora Network Simulator"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
spora-alloc.workspace = true            # This changes the global allocator for all of the next dependencies so should be kept first
spora-consensus-core.workspace = true
spora-consensus-notify.workspace = true
spora-consensus.workspace = true
spora-core.workspace = true
spora-database.workspace = true
spora-hashes.workspace = true
spora-perf-monitor.workspace = true
spora-utils.workspace = true

async-channel.workspace = true
cfg-if.workspace = true
clap.workspace = true
dhat = { workspace = true, optional = true }
futures-util.workspace = true
futures.workspace = true
indexmap.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus.workspace = true
rand_distr.workspace = true
rand.workspace = true
rayon.workspace = true
secp256k1.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
headers = "0.4.0"
time = "0.3.41"

[features]
heap = ["dhat", "spora-alloc/heap"]
semaphore-trace = ["spora-utils/semaphore-trace"]
