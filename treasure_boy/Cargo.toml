[package]
name = "treasure_boy"
description = "Tondi Transaction Generator"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "treasure_boy"
path = "src/bin/treasure_boy.rs"

[dependencies]
tondi-addresses.workspace = true
tondi-consensus-core.workspace = true
tondi-core.workspace = true
tondi-grpc-client.workspace = true
tondi-notify.workspace = true
tondi-rpc-core.workspace = true
tondi-txscript.workspace = true
tondi-utils.workspace = true
tondi-bip32.workspace = true

async-channel.workspace = true
blake3.workspace = true
clap.workspace = true
faster-hex.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
rayon.workspace = true
secp256k1 = { workspace = true, features = ["global-context", "rand-std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }

[dev-dependencies]
criterion.workspace = true
tempfile = "3.8.1"

[[bench]]
name = "bench"
harness = false
