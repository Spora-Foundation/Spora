[package]
name = "cellscript"
version = "0.1.0"
edition = "2021"
authors = ["Spora Core Team"]
description = "CellScript compiler for Spora blockchain"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spora/cellscript"

[[bin]]
name = "cellc"
path = "src/main.rs"
test = false

[lib]
name = "cellscript"
path = "src/lib.rs"

[dependencies]
# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.5", features = ["derive"] }
blake3 = "1.5"
toml = "0.8"

# 集合
dashmap = "6.0"
indexmap = "2.2"

# 日志
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4.5", features = ["derive"] }

# 颜色输出
colored = "2.1"

# 文件路径
camino = "1.1"
ckb-vm = { version = "0.24", features = ["asm", "detect-asm"], optional = true }

[features]
default = []
vm-runner = ["dep:ckb-vm"]

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
