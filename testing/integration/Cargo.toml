[package]
name = "spora-testing-integration"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
spora-alloc.workspace = true            # This changes the global allocator for all of the next dependencies so should be kept first

spora-addresses.workspace = true
spora-bip32.workspace = true
spora-consensus-core.workspace = true
spora-consensus-notify.workspace = true
spora-consensus.workspace = true
spora-consensusmanager.workspace = true
spora-core.workspace = true
spora-database.workspace = true
spora-exec.workspace = true
spora-grpc-client.workspace = true
spora-grpc-core.workspace = true
spora-grpc-server.workspace = true
spora-hashes.workspace = true
spora-index-processor.workspace = true
spora-cellindex.workspace = true
spora-math.workspace = true
spora-merkle.workspace = true
spora-muhash.workspace = true
spora-notify.workspace = true
spora-pow.workspace = true
spora-rpc-core.workspace = true
spora-rpc-service.workspace = true
spora-utils.workspace = true
sporad.workspace = true
spora-wallet-core = { workspace = true, optional = true }
spora-wrpc-client = { workspace = true, optional = true }

async-channel.workspace = true
async-trait.workspace = true
bincode.workspace = true
blake3.workspace = true
camino = "1.1"
clap.workspace = true
chrono.workspace = true
cellscript = { path = "../../cellscript" }
crossbeam-channel.workspace = true
dhat = { workspace = true, optional = true }
faster-hex.workspace = true
flate2.workspace = true
futures-util.workspace = true
indexmap.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
rand_distr.workspace = true
rand.workspace = true
rayon.workspace = true
rocksdb.workspace = true
secp256k1.workspace = true
serde_json.workspace = true
serde.workspace = true
smallvec.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
workflow-perf-monitor.workspace = true

[dev-dependencies]
criterion.workspace = true
rand = { workspace = true, features = ["small_rng"] }
tokio = { workspace = true, features = ["rt", "macros", "process"] }

[features]
heap = ["dhat"]
html_reports = []
devnet-prealloc = ["sporad/devnet-prealloc"]
cellindex-tests = []
integration-tests = []
vm = ["spora-consensus/vm"]
mempool-benchmarks = []
subscribe-benchmarks = []
wallet-account-variant-tests = ["dep:spora-wallet-core"]
consensus-mempool-template-matrix-tests = []
wrpc-probe = ["dep:spora-wrpc-client"]

[[bin]]
name = "spora-devnet-bootstrap"
path = "src/bin/spora-devnet-bootstrap.rs"

[[bin]]
name = "spora-devnet-probe"
path = "src/bin/spora-devnet-probe.rs"
required-features = ["wrpc-probe"]

[[bin]]
name = "spora-standard-relay-probe"
path = "src/bin/spora-standard-relay-probe.rs"
required-features = ["integration-tests", "devnet-prealloc", "vm", "wrpc-probe"]
